spring:
  application:
    name: premium-essai-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/premium_essai_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom JWT Configuration
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-days: ${JWT_EXPIRATION_DAYS}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.premium.essai: DEBUG
    org.hibernate.SQL: DEBUG